# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# ForgeGradle 7 supports the configuration cache, but IDE sync is more reliable without it.
org.gradle.configuration-cache=false

# Dev runs (runClient/runServer) need classes and resources in one folder for Forge to find the mod.
net.minecraftforge.gradle.merge-source-sets=true

# Shared by every Minecraft version. Per-version Minecraft / Forge versions are in
# versions/<minecraft>/gradle.properties.
forgegradle_version=[7.0.40,8)

# Mod Properties
version=1.1.0
group=net.adeptfrog.blocksmith
